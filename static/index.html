<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosine Similarity</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #dbe3ee;
      --ok-bg: #eefbf3;
      --ok-border: #bfe8cc;
      --err-bg: #fef2f2;
      --err-border: #fecaca;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(860px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(16, 24, 40, 0.08);
      padding: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.4rem, 2vw, 1.9rem);
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    @media (min-width: 860px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font: inherit;
      resize: vertical;
      background: #fbfdff;
    }

    textarea:focus {
      outline: 2px solid #bfdbfe;
      border-color: #93c5fd;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 11px 18px;
      cursor: pointer;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.65; cursor: not-allowed; }

    .result {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--ok-border);
      background: var(--ok-bg);
      font-size: 1rem;
      font-weight: 600;
    }

    .result.error {
      border-color: var(--err-border);
      background: var(--err-bg);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Cosine Similarity</h1>
    <p class="subtitle">Enter two texts and compare how similar they are.</p>

    <div class="grid">
      <div class="field">
        <label for="doc1">Input 1</label>
        <textarea id="doc1" placeholder="Enter first text"></textarea>
      </div>

      <div class="field">
        <label for="doc2">Input 2</label>
        <textarea id="doc2" placeholder="Enter second text"></textarea>
      </div>
    </div>

    <div class="actions">
      <button id="calculateBtn">Calculate Similarity</button>
    </div>

    <div class="result" id="similarity">Similarity: -</div>
  </main>

  <script>
    const doc1El = document.getElementById("doc1");
    const doc2El = document.getElementById("doc2");
    const similarityEl = document.getElementById("similarity");
    const buttonEl = document.getElementById("calculateBtn");

    buttonEl.addEventListener("click", async () => {
      const doc1 = doc1El.value.trim();
      const doc2 = doc2El.value.trim();

      similarityEl.classList.remove("error");

      if (!doc1 || !doc2) {
        similarityEl.textContent = "Similarity: please fill both inputs.";
        similarityEl.classList.add("error");
        return;
      }

      buttonEl.disabled = true;
      similarityEl.textContent = "Similarity: calculating...";

      try {
        const url = `/cosine_similarity?v1=${encodeURIComponent(doc1)}&v2=${encodeURIComponent(doc2)}`;
        const resp = await fetch(url, { method: "POST" });

        if (!resp.ok) throw new Error("Request failed.");

        const data = await resp.json();
        similarityEl.textContent = `Similarity: ${Number(data.cosine_similarity).toFixed(6)}`;
      } catch (err) {
        similarityEl.textContent = `Similarity: error (${err.message})`;
        similarityEl.classList.add("error");
      } finally {
        buttonEl.disabled = false;
      }
    });
  </script>
</body>
</html>
